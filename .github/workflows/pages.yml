name: Deploy site

# Publishes the static project site in docs/ to GitHub Pages.
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that this runs on every push to main
# that touches docs/.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  # Redeploy after a firmware build publishes a Release, so the flasher's
  # bundled firmware/ directory picks up the new version (see "Bundle firmware").
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Assemble the publish dir from docs/ plus the device screenshots, which
      # live in tools/preview/out/ (regenerated on every UI change) and are
      # copied in here rather than duplicated into docs/ — so the gallery is
      # always current and the repo carries a single copy of each image.
      #
      # The copying lives in tools/site-images.sh so that a local preview can
      # run the same step; when it only existed here, `docs/` served on its own
      # showed whatever stale images were sitting in the working copy.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -R docs/. _site/
          sh tools/site-images.sh _site/img
          touch _site/.nojekyll

      # Serve firmware.bin from the site itself rather than linking the GitHub
      # Release asset.
      #
      # GitHub moved release-asset downloads to release-assets.githubusercontent.com
      # (Azure Blob), which sends NO access-control-allow-origin header. A browser
      # fetch() of a release asset from the site's origin therefore fails with
      # "Failed to fetch", which broke the web flasher for every version. The
      # api.github.com asset endpoint does not help: its 302 carries CORS but the
      # blob it redirects to does not, and browsers require CORS on the FINAL
      # response.
      #
      # Downloading here is server-side, so CORS never applies; the flasher then
      # fetches a same-origin path and needs no CORS at all. Nothing is committed
      # to the repo, so there is no binary bloat in git.
      - name: Bundle firmware for the web flasher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/firmware
          # Newest 10 releases that actually carry a firmware.bin.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 30 \
            --json tagName --jq '.[].tagName' > tags.txt || true
          : > _site/firmware/index.json
          echo "[" >> _site/firmware/index.json
          first=1
          count=0
          while read -r tag; do
            [ -n "$tag" ] || continue
            [ "$count" -ge 10 ] && break
            if gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
                 --pattern firmware.bin --dir "_site/firmware/$tag" 2>/dev/null; then
              [ "$first" = 1 ] || echo "," >> _site/firmware/index.json
              printf '  {"tag": "%s", "url": "firmware/%s/firmware.bin"}' \
                "$tag" "$tag" >> _site/firmware/index.json
              first=0
              count=$((count + 1))
              echo "bundled $tag"
            fi
          done < tags.txt
          echo "" >> _site/firmware/index.json
          echo "]" >> _site/firmware/index.json
          echo "--- index.json ---"; cat _site/firmware/index.json

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
