name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed so the firmware and Android jobs can publish Releases on push to main.
permissions:
  contents: write

jobs:
  firmware:
    name: Firmware (ESP32-S3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The espressif32 toolchain is a few hundred MB and unpacks slowly;
      # keyed on platformio.ini so a platform bump refetches it.
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # Board definition + display/touch/battery drivers live here, and
      # platformio.ini points boards_dir/lib_extra_dirs at it.
      - name: Clone LilyGO board support
        run: |
          git clone --depth 1 \
            https://github.com/Xinyuan-LilyGO/T5S3-4.7-e-paper-PRO \
            vendor/T5S3-4.7-e-paper-PRO

      # The stock framework's esp_pm_configure() is a precompiled stub that
      # returns ESP_ERR_NOT_SUPPORTED, so firmware built on it logs
      # "pm: light sleep UNAVAILABLE" and never sleeps. Overlay the PM-enabled
      # libs (built once by build-pm-libs.yml, pinned as the pm-libs-1
      # prerelease asset) before building. Idempotent, so a cache hit that
      # restored an already-overlaid ~/.platformio is fine.
      - name: Install framework and apply PM overlay
        run: |
          pio pkg install -e t5s3-painter
          tools/apply-pm-framework.sh

      - name: Build
        run: pio run

      # Prove the binary that ships actually contains power management — the
      # overlay silently not taking (wrong cache, changed package layout) would
      # otherwise reproduce the exact bug this guards against: a release that
      # logs "pm: light sleep UNAVAILABLE" on every device.
      - name: Verify firmware links real PM
        run: |
          nm=$(ls ~/.platformio/packages/toolchain-xtensa-esp32s3*/bin/xtensa-esp32s3-elf-nm | head -1)
          hex=$("$nm" --print-size --defined-only .pio/build/t5s3-painter/firmware.elf \
                | awk '$4 == "esp_pm_configure" { print $2 }')
          size=$(( 16#${hex:-0} ))
          echo "esp_pm_configure size: $size"
          if [ "$size" -le 100 ]; then
            echo "::error::firmware.elf has a stub esp_pm_configure — PM overlay did not take"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/t5s3-painter/firmware.bin
            .pio/build/t5s3-painter/firmware.elf
          if-no-files-found: error

      # Publish firmware.bin to a GitHub Release so the web flasher can fetch it
      # (Actions artifacts need auth and expire; Releases are public + permanent).
      # One release per FIRMWARE_VERSION, refreshed on every push to main.
      - name: Read firmware version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ver
        run: |
          v=$(sed -n 's/.*FIRMWARE_VERSION[[:space:]]*"\([^"]*\)".*/\1/p' src/config.h)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      # The release body is this version's CHANGELOG.md section — the app shows
      # it as "What's new" when offering the update, so the changelog IS the
      # user-facing release notes. A missing section still publishes (with a
      # placeholder) rather than blocking the release.
      - name: Extract release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v ver="## $v" '$0 == ver {on=1; next} on && /^## / {exit} on' \
            CHANGELOG.md | sed -e '/./,$!d' > relnotes.md
          if [ ! -s relnotes.md ]; then
            echo "Firmware $v." > relnotes.md
          fi
          printf '\nBuilt from %s. Flash it from the app (Settings > Firmware), the project site, or drop firmware.bin on the SD card.\n' "$GITHUB_SHA" >> relnotes.md

      - name: Publish firmware release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.version }}
          name: Firmware ${{ steps.ver.outputs.version }}
          body_path: relnotes.md
          files: .pio/build/t5s3-painter/firmware.bin
          fail_on_unmatched_files: true

  # The Meshtastic codec is the one part of the firmware whose bugs are invisible
  # on hardware — a wrongly tuned or wrongly keyed node just hears nothing — so
  # its host tests gate every push. No toolchain needed: mesh_proto.cpp is plain
  # C++ with no Arduino dependency, which is why it was written that way.
  mesh-tests:
    name: Meshtastic wire format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host tests
        run: sh tools/mesh_test/run_mesh_test.sh

  ios:
    name: Companion app (iOS)
    # RouteView uses MKDirectionsTransportType.cycling, which Apple only
    # exposes in the iOS 26 SDK (backdated to iOS 14 availability). macos-15
    # defaults to Xcode 16.4 / iOS 18.5, where that symbol does not exist.
    runs-on: macos-26
    defaults:
      run:
        working-directory: companion-ios
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Signing off: the project pins a DEVELOPMENT_TEAM that a runner has no
      # certificate for, and this only needs to prove the app compiles.
      # Built by -target against the simulator SDK rather than
      # -scheme/-destination: no scheme is committed (project.yml declares
      # none, so schemes are synthesized per-invocation) and this form needs
      # neither scheme autocreation nor run-destination resolution.
      - name: Build
        run: |
          xcodebuild -version
          xcodebuild build \
            -project OpenTrailPaper.xcodeproj \
            -target OpenTrailPaper \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO

  android:
    name: Companion app (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion-android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Wrapper + dependency caching, keyed on the lockable Gradle inputs.
      - uses: gradle/actions/setup-gradle@v4

      # The format tests are the only thing standing between a wrong byte order
      # and a route that transfers cleanly then draws the wrong line. Cheap
      # enough (~10s) to gate every push.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # The runner image ships the Android SDK at $ANDROID_HOME, so there is
      # no local.properties step.
      #
      # Release, not debug, so the APK is the minified build riders actually
      # get — R8 stripping a class the app reflects on would otherwise only
      # surface after a merge. It is signed with a dedicated *sideload* key
      # held in repo secrets: not the Play upload key, which (under Play App
      # Signing) is not the key Play-installed copies carry anyway, and whose
      # leak would be far worse than this one's. A fork PR has no secrets, so
      # there the build comes out unsigned (app/build.gradle.kts tolerates
      # that) and simply proves it compiles.
      # (Guarded in the shell: the secrets context is not allowed in a
      # step-level `if`.)
      - name: Install sideload signing key
        env:
          OTP_KEYSTORE_B64: ${{ secrets.OTP_KEYSTORE_B64 }}
        run: |
          if [ -z "$OTP_KEYSTORE_B64" ]; then
            echo "::warning::OTP_KEYSTORE_B64 not available — release APK will be unsigned"
            exit 0
          fi
          echo "$OTP_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/sideload.jks"
          echo "OTP_KEYSTORE_FILE=$RUNNER_TEMP/sideload.jks" >> "$GITHUB_ENV"

      - name: Build
        env:
          OTP_KEYSTORE_PASSWORD: ${{ secrets.OTP_KEYSTORE_PASSWORD }}
          OTP_KEY_ALIAS: ${{ secrets.OTP_KEY_ALIAS }}
          OTP_KEY_PASSWORD: ${{ secrets.OTP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      # Read versionName out of the built APK rather than re-parsing the
      # gradle file, so the tag below can never disagree with what installs.
      - name: Read app version
        id: app
        run: |
          aapt=$(ls "$ANDROID_HOME"/build-tools/*/aapt | sort -V | tail -1)
          v=$("$aapt" dump badging app/build/outputs/apk/release/app-release.apk \
                | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "version=$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "OpenTrailPaper-$v.apk"

      # Installable straight from the workflow run, the way the firmware
      # artifact is flashable. Only useful when signed (see above).
      - uses: actions/upload-artifact@v4
        with:
          name: companion-android-apk
          path: companion-android/OpenTrailPaper-*.apk
          if-no-files-found: error

      # An unsigned APK will not install on any phone, so publishing one would
      # be a broken download with a green check next to it. Fail loudly on
      # main instead: the secrets have gone missing, which is a config problem
      # to fix, not a build to ship.
      - name: Verify the APK is signed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          if ! "$apksigner" verify --print-certs "OpenTrailPaper-${{ steps.app.outputs.version }}.apk"; then
            echo "::error::release APK is unsigned — OTP_KEYSTORE_* secrets missing or wrong"
            exit 1
          fi

      # Publish the APK as a GitHub Release so anyone can sideload it without a
      # GitHub login (Actions artifacts need auth and expire). One release per
      # versionName, refreshed on every push to main, same as the firmware.
      #
      # prerelease is load-bearing: both companion apps fetch
      # /releases/latest to find firmware.bin, and GitHub excludes prereleases
      # from "latest". Without it the newest APK release would shadow the
      # firmware and every in-app update check would find nothing.
      - name: Write release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > relnotes.md <<EOF
          Android companion app ${{ steps.app.outputs.version }}, built from ${GITHUB_SHA}.

          Download the APK below and open it on your phone; Android will ask you to allow installs from your browser or file manager the first time. Updates install over the top of an earlier sideloaded copy. This build is signed with a different key from the Play Store version, so it cannot update a Play-installed copy (uninstall that one first).
          EOF

      - name: Publish APK release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.app.outputs.version }}
          name: Android app ${{ steps.app.outputs.version }}
          body_path: companion-android/relnotes.md
          prerelease: true
          files: companion-android/OpenTrailPaper-${{ steps.app.outputs.version }}.apk
          fail_on_unmatched_files: true
