; Open e-paper bike computer for LilyGO T5S3 4.7" e-paper PRO
;
; Board definition and driver libraries come from the vendored LilyGO repo
; (vendor/T5S3-4.7-e-paper-PRO). Re-clone it if missing:
;   git clone --depth 1 https://github.com/Xinyuan-LilyGO/T5S3-4.7-e-paper-PRO vendor/T5S3-4.7-e-paper-PRO

[platformio]
; The EPD_Painter build is now the shipping one — plain `pio run` builds it, and
; CI uploads/releases from .pio/build/t5s3-painter/ (keep .github/workflows/
; build.yml in step with this name; it matches on an exact path and fails the
; release if the file is missing). t5s3-pro stays buildable as the epdiy
; fallback: `pio run -e t5s3-pro`.
default_envs = t5s3-painter
boards_dir = vendor/T5S3-4.7-e-paper-PRO/boards

[env:t5s3-pro]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; No embedded fallback map: the device shows only maps downloaded to the SD
; card. (To restore a built-in base map, re-add:
;   board_build.embed_files = data/sf.ebm
; and the map_ebm_start/end load path in src/map_store.cpp.)

lib_extra_dirs =
    vendor/T5S3-4.7-e-paper-PRO/lib

lib_deps =
    Wire
    SPI
    h2zero/NimBLE-Arduino@^2.2.3
    symlink:///Users/raemond/Documents/esp32-ant+/components/ant

build_flags =
    -DBOARD_HAS_PSRAM
    -DPSRAM_SPEED=120MHz
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; USB-OTG (TinyUSB) mode instead of the board default USB-Serial-JTAG (=1),
    ; so the SD card can be exposed as USB Mass Storage. Serial/flashing still
    ; work over the native USB CDC. (Recover a bad flash via manual download
    ; mode: hold BOOT, tap RESET, then upload.)
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DCORE_DEBUG_LEVEL=2
    -DDISABLE_ALL_LIBRARY_WARNINGS
    -Wl,--gc-sections
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5

; --- EPD_Painter evaluation (see tools/epdpainter_test/main.cpp) -------------
; A standalone app that reproduces the conditions causing our grey drift, built
; against Tony Weston's EPD_Painter driver instead of epdiy. Separate env so it
; never affects the shipping firmware: build_src_filter drops src/ entirely and
; compiles only the test.
;   pio run -e epdpainter-test -t upload
[env:epdpainter-test]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_src_filter = -<*> +<../tools/epdpainter_test/>
lib_deps =
    Wire
    SPI
    https://github.com/tonywestonuk/EPD_Painter.git
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.14.5
; EPD_Painter uses inline variables and designated initialisers, so it needs
; C++17; the Arduino framework defaults to gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    ; AUTO rather than the explicit board macro: the T5_S3_GPS preset is still
    ; compiled (its #if is "GPS || AUTO"), but AUTO additionally defines the
    ; Probe[] table, which EPD_Painter.cpp references unconditionally — with an
    ; explicit preset it is undefined and the library will not compile. We still
    ; pass EPD_LILYGO_T5_S3_GPS_PRESET to the constructor, so no runtime probing
    ; happens; this only satisfies the compiler.
    -DEPD_PAINTER_PRESET_AUTO
    ; esp_cpu_get_cycle_count() is an IDF 5.x name; on our IDF 4.4 framework the
    ; same function is esp_cpu_get_ccount(). Mapping it here avoids patching the
    ; dependency, which lib_deps would re-fetch and overwrite.
    -Desp_cpu_get_cycle_count=esp_cpu_get_ccount
    -DCORE_DEBUG_LEVEL=2

; --- Firmware on EPD_Painter instead of epdiy (the port; see epd_compat.h) ----
; THE SHIPPING BUILD (default_envs above). Proven on hardware: boots, renders the
; dashboard, BLE/GPS/SD all up. t5s3-pro remains as the epdiy fallback if the
; port needs backing out.
;   pio run -e t5s3-painter -t upload
[env:t5s3-painter]
platform = espressif32@6.5.0
board = T5-ePaper-S3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
boards_dir = vendor/T5S3-4.7-e-paper-PRO/boards
; Hands-free upload: the hooks reboot the running firmware into the ROM loader
; before flashing and reset it back into the app afterwards, so `pio run -t
; upload` needs no BOOT/RESET presses. Both resets have to be ours, hence the
; no_reset pair -- esptool's own are wrong for this board (see tools/flash.py).
extra_scripts = post:tools/pio_upload.py
board_upload.before_reset = no_reset
board_upload.after_reset = no_reset
lib_extra_dirs =
    vendor/T5S3-4.7-e-paper-PRO/lib
; epdiy supplies the TYPES our renderers and font data use, but none of its
; source may be compiled: epd_renderer_init() claims LCD_CAM and would fight
; EPD_Painter. lib_ignore drops the library from the build while the -I below
; keeps its headers reachable. src/epd_compat.cpp provides the implementations.
lib_ignore = epdiy
lib_deps =
    Wire
    SPI
    h2zero/NimBLE-Arduino@^2.2.3
    https://github.com/tonywestonuk/EPD_Painter.git
    ; ANT+ on the ESP32's own radio (src/ant_sensors.cpp). A symlink into the
    ; local checkout so library edits are picked up by the next build; switch
    ; to the git URL (git@github.com:RaemondBW/esp32-ant.git, subdir
    ; components/ant) before this can build anywhere else.
    symlink:///Users/raemond/Documents/esp32-ant+/components/ant
build_unflags = -std=gnu++11
build_flags =
    ; Vector fonts (Anton values / Arimo labels) instead of the bitmap
    ; Impact/Arial tables — same faces at the same heights, ~950 KB less flash.
    -DVFONT
    -std=gnu++17
    -I vendor/T5S3-4.7-e-paper-PRO/lib/epdiy/src
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -UARDUINO_USB_MODE
    -DARDUINO_USB_MODE=0
    -DEPD_PAINTER_PRESET_AUTO
    -Desp_cpu_get_cycle_count=esp_cpu_get_ccount
    ; Selects the EPD_Painter panel layer over the epdiy one. Only src/ code that
    ; touches the PANEL needs this — the renderers go through epd_compat.h and
    ; are identical either way. Today that is smooth_epd.cpp, which drives
    ; epdiy's LCD primitives directly and has no EPD_Painter equivalent.
    -DUSE_EPD_PAINTER
    ; Debug aids for boot-time faults, both OFF because this env ships. The 8 s
    ; wait is why EPDC_BOOT_WAIT must stay off by default — it is paid on every
    ; host-less cold boot.
    ;
    ; Enable them TOGETHER. EPDC_BOOT_WAIT is useless on its own: its
    ; `while (!Serial)` can never be satisfied when nothing has started TinyUSB
    ; yet, so it just burns its full 8 s and continues host-less. This pair is
    ; what made the SD boot loop diagnosable (investigations/intwdt-ride-
    ; recovery-2026-08-05.log); without it the device produced no log at all.
    ;   -DDEBUG_EARLY_USB   ; start TinyUSB in setup() so the port exists before
    ;                       ; the SD is touched. Costs USB mass storage.
    ;   -DEPDC_BOOT_WAIT    ; hold setup() until a serial host attaches (max 8 s),
    ;                       ; repoint stdout at the USB-CDC so the display
    ;                       ; library's own printf/log_w are readable at all (they
    ;                       ; otherwise go to UART0 -> GPIO43, which is
    ;                       ; BOARD_GPS_TXD), and trace each panel init step.
    -DCORE_DEBUG_LEVEL=2
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5
    -Wl,--gc-sections
    -I companion-ios/Sources/H3
    -I companion-ios/Sources/H3/include

; H3 (the same vendored copy the iOS app builds — companion-ios/Sources/H3), so
; the device can turn a position into the tile ids that cover it instead of
; indexing the card. A tile's FILENAME is its H3 cell id, and an H3 id encodes
; its own location, so "which tiles do I need here?" is arithmetic rather than a
; scan of every .ebm on the card. Built from the app's copy, not a second one:
; the two must agree on cell ids exactly or the device looks for files the app
; never wrote.
build_src_filter = +<*> +<../companion-ios/Sources/H3/h3shim.c> +<../companion-ios/Sources/H3/lib/*.c>
